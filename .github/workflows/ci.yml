name: Validate portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate static pages, project builds and public CV
        run: npm test
      - name: Regenerate CV HTML from structured content
        run: node scripts/build-cv.mjs
      - name: Check committed HTML matches its source
        run: git diff --exit-code -- cv.html
